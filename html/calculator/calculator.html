<!DOCTYPE html>

<html>
    <head>
        <meta charset="utf-8">
        <title>Calculator</title>
        <link rel="stylesheet" type="text/css" href="calculator.css">
    </head>

    <body>
        <div class="calculator">
            <p id="numbers" class="numbers">Numbers</p>
            <p id="expression" class="expression">Full Expression</p>
            <table class="buttontable">
                <tbody>
                    <tr>
                        <td>
                            <button id="7_Button">7</button>
                        </td>
                        <td>
                            <button id="8_Button">8</button>
                        </td>
                        <td>
                            <button id="9_Button">9</button>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <button id="4_Button">4</button>
                        </td>
                        <td>
                            <button id="5_Button">5</button>
                        </td>
                        <td>
                            <button id="6_Button">6</button>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <button id="1_Button">1</button>
                        </td>
                        <td>
                            <button id="2_Button">2</button>
                        </td>
                        <td>
                            <button id="3_Button">3</button>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <button id="+/-_Button">+/-</button>
                        </td>
                        <td>
                            <button id="0_Button">0</button>
                        </td>
                        <td>
                            <button id="._Button">.</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <script src="calculator.js"></script>
        <div id="myDynamicTable">
            
        </div>
    </body>
        
</html>
