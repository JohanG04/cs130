<!DOCTYPE html>

<html>
    <head>
        <meta charset="utf-8">
        <title>DataBrowser Lab</title>
        <link rel="stylesheet" type="text/css" href="DataBrowser.css">
    </head>
    
    <body>
        <nav class="topbar">
            <!--User Sorting Methods-->
            <label>Items Shown:
                <select>
                    <option value="10">10</option>
                    <option value="20">20</option>
                    <option value="30">30</option>
                    <option value="40">40</option>
                </select>
            </label>
            <label>Sort By Name: <input type="search"></label>
        </nav>
        
        <div class="table">
            <table id="objTable" class="objTable">
                <tbody></tbody>
            </table>
            
        </div>

        <div class="objectView" id="objectView"> <!--Should NOT be visible to start. Will display object information individually-->
            <h1>Object Name</h1> 
            <p>0/0</p>
            
            <div> <!--Buttons-->
                <input type="button" value="x" id="closeOV">
                <input type="button" value="<<" id="first">
                <input type="button" value="<" id="previous">
                <input type="button" value=">" id="next">
                <input type="button" value=">>" id="last">
            </div>
        </div>

        <script src="DataBrowser.js"></script>
    </body>
</html>
