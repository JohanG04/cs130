<!DOCTYPE html>

<html>
    <head>
        <meta charset="utf-8">
        <title>CSCI 130 - lab 6</title>
        <link rel="stylesheet" type="text/css" href="lab6.css">
    </head>
    <body>
        <fieldset>
            <h2>Function:</h2>
            <h3 class="function" id="function">(a3)x^3 + (a2)x^2 + (a1)x + (a0)</h3>

            <ul>
                <li class="input">
                    <label for="a0"> a0: </label>
                    <input type="number" id="a0" name="a0" required>
                </li>
                <li class="input">
                    <label for="a1"> a1: </label>
                    <input type="number" id="a1" name="a1" required>
                </li>
                <li class="input">
                    <label for="a2"> a2: </label>
                    <input type="number" id="a2" name="a2" required>
                </li>
                <li class="input">
                    <label for="a3"> a3: </label>
                    <input type="number" id="a3" name="a3" required>
                </li>
                <li class="input">
                    <label for="xmin"> xmin:</label>
                    <input type="number" id="xmin" name="xmin" required>
                </li>
                <li class="input">
                    <label for="xmax"> xmax:</label>
                    <input type="number" id="xmax" name="xmax" required>
                </li>
                <li class="input">
                    <label for="points"> n points:</label>
                    <input type="number" id="points" name="points" required>
                </li>
                <li class="input">
                    <label for="axis"> Axis: </label>
                    <input type="checkbox" id="axis" name="axis" class="axis" checked>
                </li>
                <li class="input">
                    <input type="submit" id="graphButton" class="graphButton" value="Graph">
                </li>
            </ul>
        </fieldset>

        <canvas id="graph" class="graph" width="600" height="600"></canvas>

        <div id="pointsdiv">
            <header>
                <h2>Points:</h2>
            </header>
            <table>
                <thead>
                    <tr>
                        <th>x</th>
                        <th>y</th>
                    </tr>
                </thead>
                <tbody id="pointstable">
                    <tr>
                        <td>x value</td>
                        <td>y value</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <script src="lab6.js"></script>
    </body>
</html>
